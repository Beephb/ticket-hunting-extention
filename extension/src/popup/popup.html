<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Săn Vé Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; background: #0f172a; color: #e2e8f0; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  .header { background: #111827; padding: 12px 16px 10px; border-bottom: 1px solid #1e293b; }
  .header h1 { font-size: 15px; font-weight: 600; color: #fbbf24; }
  .header .sub { font-size: 11px; color: #64748b; margin-top: 2px; }
  .body { padding: 12px 14px; }

  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    padding: 8px 12px; background: #111827; border-radius: 8px; border: 1px solid #1e293b; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #4b5563; }
  .dot.online { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
  .dot.offline { background: #ef4444; }
  .status-text { flex: 1; font-size: 12px; color: #94a3b8; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toggle-label { font-weight: 500; color: #e2e8f0; }
  .toggle { position: relative; width: 40px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #374151; border-radius: 22px; cursor: pointer; transition: background .2s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: #22c55e; }
  input:checked + .slider:before { transform: translateX(18px); }

  .btn-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .btn { position: relative; width: 100%; padding: 0; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s;
    display: flex; align-items: center; overflow: hidden; }
  .btn:hover { opacity: .88; }
  .btn-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; }
  .btn-content { flex: 1; text-align: left; padding: 0 10px 0 0; }
  .btn-title { font-weight: 600; font-size: 12px; line-height: 1.3; }
  .btn-tip { font-size: 10px; opacity: .7; line-height: 1.3; margin-top: 1px; }

  .btn-auto    { background: #7c3aed; color: #ede9fe; }
  .btn-hunt    { background: #1e3a5f; color: #93c5fd; }
  .btn-seat    { background: #14532d; color: #86efac; }
  .btn-form    { background: #065f46; color: #6ee7b7; }
  .btn-stop    { background: #7f1d1d; color: #fca5a5; }

  .config-box { background: #111827; border: 1px solid #1e293b; border-radius: 8px;
    padding: 8px 12px; margin-bottom: 10px; font-size: 11px; }
  .config-box .row { display: flex; justify-content: space-between; margin-bottom: 3px; color: #64748b; }
  .config-box .row:last-child { margin-bottom: 0; }
  .config-box .val { color: #e2e8f0; font-weight: 500; }

  .log-box { background: #0d1117; border: 1px solid #1e293b; border-radius: 8px;
    padding: 6px 10px; font-size: 10px; font-family: monospace; color: #64748b;
    max-height: 70px; overflow-y: auto; margin-bottom: 8px; line-height: 1.5; }

  .footer { padding: 6px 16px 10px; text-align: center; font-size: 10px; color: #334155; }
</style>
</head>
<body>
<div class="header">
  <h1>🎫 Săn Vé Pro</h1>
  <div class="sub" id="sub-text">v2.0.0 — Đang kiểm tra App...</div>
</div>
<div class="body">
  <div class="status-row">
    <div class="dot" id="app-dot"></div>
    <div class="status-text" id="app-status">Đang kết nối Desktop App...</div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Bot tự động</span>
    <label class="toggle">
      <input type="checkbox" id="bot-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="config-box" id="config-box">
    <div class="row"><span>Platform</span><span class="val" id="cfg-platform">—</span></div>
    <div class="row"><span>Mode</span><span class="val" id="cfg-mode">—</span></div>
    <div class="row"><span>Ưu tiên</span><span class="val" id="cfg-zones">—</span></div>
    <div class="row"><span>Số lượng</span><span class="val" id="cfg-qty">—</span></div>
  </div>

  <div class="log-box" id="log-box">Chờ hoạt động...</div>

  <div class="btn-group">
    <button class="btn btn-auto" id="btn-hunt-auto">
      <div class="btn-icon">🏹</div>
      <div class="btn-content">
        <div class="btn-title">Săn vé tự động toàn bộ</div>
        <div class="btn-tip">Tìm vé → vào booking → chọn ghế → điền form</div>
      </div>
    </button>

    <button class="btn btn-hunt" id="btn-hunt-only">
      <div class="btn-icon">🔍</div>
      <div class="btn-content">
        <div class="btn-title">Chỉ săn vé</div>
        <div class="btn-tip">Tìm vé → vào booking rồi dừng</div>
      </div>
    </button>

    <button class="btn btn-seat" id="btn-seat">
      <div class="btn-icon">🪑</div>
      <div class="btn-content">
        <div class="btn-title">Chỉ chọn ghế</div>
        <div class="btn-tip">Dùng khi đang ở trang chọn ghế</div>
      </div>
    </button>

    <button class="btn btn-form" id="btn-form">
      <div class="btn-icon">📝</div>
      <div class="btn-content">
        <div class="btn-title">Chỉ điền form</div>
        <div class="btn-tip">Dùng khi đang ở trang checkout</div>
      </div>
    </button>

    <button class="btn btn-stop" id="btn-stop">
      <div class="btn-icon">⏹</div>
      <div class="btn-content">
        <div class="btn-title">Dừng Hunt</div>
        <div class="btn-tip">Dừng poller và clicker</div>
      </div>
    </button>
  </div>
</div>
<div class="footer">Port 9279 · Alt+1/2/3</div>
<script src="popup.js"></script>
</body>
</html>
